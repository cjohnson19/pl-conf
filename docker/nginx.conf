# Buffering compression proxy in front of the Next standalone server.
#
# Next streams every response as many small chunks, and its built-in compress
# gzips per chunk — ~6x worse on the wire than compressing the response whole
# (234KB vs 36KB for the archive flight payload). Next's compress is off
# (next.config.ts); nginx buffers each upstream response fully, then
# compresses it in one pass. CloudFront caches whichever encoding it
# negotiates (the HtmlCachePolicy enables both gzip and brotli).
#
# Runs as the unprivileged `app` user: pid and temp paths live in /tmp, the
# apk-owned /var/lib/nginx and /var/log/nginx are chowned in the Dockerfile.

load_module /usr/lib/nginx/modules/ngx_http_brotli_filter_module.so;

pid /tmp/nginx.pid;
worker_processes 1;
error_log stderr warn;

events {
  worker_connections 1024;
}

http {
  access_log off;

  client_body_temp_path /tmp/nginx-client-body;
  proxy_temp_path /tmp/nginx-proxy;
  fastcgi_temp_path /tmp/nginx-fastcgi;
  uwsgi_temp_path /tmp/nginx-uwsgi;
  scgi_temp_path /tmp/nginx-scgi;

  # Hold the whole upstream response before the compression filters run —
  # this buffering is the entire point of the proxy.
  proxy_buffering on;
  proxy_buffers 64 16k;
  proxy_busy_buffers_size 64k;
  proxy_max_temp_file_size 16m;

  gzip on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_vary on;
  gzip_types
    text/x-component
    text/css
    text/calendar
    text/plain
    text/xml
    application/javascript
    application/json
    application/xml
    image/svg+xml;

  brotli on;
  brotli_comp_level 5;
  brotli_min_length 1024;
  brotli_types
    text/x-component
    text/css
    text/calendar
    text/plain
    text/xml
    application/javascript
    application/json
    application/xml
    image/svg+xml;

  upstream next {
    server 127.0.0.1:3001;
    keepalive 8;
  }

  server {
    listen 3000;

    location / {
      proxy_pass http://next;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $http_host;
      # nginx owns compression; never let Next negotiate an encoding.
      proxy_set_header Accept-Encoding "";
      proxy_read_timeout 60s;
      # Mark Next's hydration chunks inert so the browser neither fetches nor
      # runs them while the page is still painting; the inline loader in
      # packages/web/app/layout.tsx re-creates them one frame after `load`.
      # The search/replace pair is mirrored by DEFERRED_CHUNK_SUB_FILTER in
      # packages/web/app/lib/deferred-chunks.ts, and a test keeps them equal.
      sub_filter_once off;
      sub_filter '<script src="/_next/static/chunks/' '<script type="text/plain" data-pl-defer src="/_next/static/chunks/';
    }
  }
}
